<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | MG Eventos</title>
    <meta name="description" content="Próximos eventos organizados por MG Eventos.">
    <link rel="icon" type="image/png" href="../images/mg-eventos-logo.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111827;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
        }

        .header-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #111827;
        }

        .brand img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 50%;
        }

        .brand span {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .navigation {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 100px;
            padding: 9px 18px;
            border: 1px solid #d9ad55;
            border-radius: 25px;
            background: #ffffff;
            color: #111827;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.7px;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .nav-link:hover {
            background: #d9ad55;
            color: #111827;
            transform: translateY(-1px);
        }

        .nav-link.active {
            background: #d9ad55;
            color: #111827;
            cursor: default;
        }

        .nav-link.active:hover {
            background: #d9ad55;
            color: #111827;
            transform: none;
        }

        main {
            width: 100%;
        }

        .events-section {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px 20px 35px;
            text-align: center;
        }

        .events-section h1 {
            font-size: 32px;
            line-height: 1.2;
            margin-bottom: 8px;
            color: #111827;
            letter-spacing: 0.5px;
        }

        .intro {
            max-width: 650px;
            margin: 0 auto 20px;
            font-size: 17px;
            line-height: 1.45;
            color: #4b5563;
        }

        .events-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 24px;
            max-width: 900px;
            margin: 0 auto;
        }

        .event-card {
            flex: 0 0 280px;
            width: 280px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            text-align: left;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.12);
        }

        .event-image-link {
            display: block;
            line-height: 0;
        }

        .event-image {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
            background: #f8fafc;
        }

        .event-content {
            padding: 14px 14px 16px;
        }

        .event-content h2 {
            font-size: 20px;
            line-height: 1.2;
            margin-bottom: 6px;
            color: #111827;
        }

        .event-date {
            display: block;
            margin-bottom: 8px;
            color: #111827;
            font-size: 12px;
            line-height: 1.3;
            font-weight: 700;
        }

        .event-content p {
            font-size: 14px;
            line-height: 1.4;
            color: #4b5563;
            margin-bottom: 12px;
        }

        .event-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            flex-wrap: nowrap;
        }

        .event-button {
            flex: 1 1 0;
            min-width: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 5px;
            border: 2px solid #d9ad55;
            border-radius: 25px;
            background: #111827;
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            line-height: 1;
            white-space: nowrap;
            text-align: center;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .event-button:hover {
            background: #1f2937;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .more-info-button {
            background: #111827;
            color: #ffffff;
        }

        .more-info-button:hover {
            background: #1f2937;
            color: #ffffff;
        }

        footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #eeeeee;
            color: #9ca3af;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            .header-container {
                padding: 10px 15px;
                gap: 10px;
                flex-direction: column;
            }

            .brand {
                width: 100%;
                justify-content: center;
            }

            .navigation {
                width: 100%;
                justify-content: center;
                gap: 6px;
            }

            .brand img {
                width: 42px;
                height: 42px;
            }

            .brand span {
                font-size: 18px;
            }

            .nav-link {
                min-width: auto;
                padding: 8px 10px;
                font-size: 11px;
                letter-spacing: 0.3px;
            }

            .events-section {
                padding: 12px 15px 30px;
            }

            .events-section h1 {
                font-size: 27px;
                margin-bottom: 7px;
            }

            .intro {
                font-size: 16px;
                margin-bottom: 18px;
            }

            .events-grid {
                gap: 20px;
            }

            .event-card {
                flex-basis: 280px;
            }

            .event-content {
                padding: 14px 14px 16px;
            }

            .event-actions {
                gap: 6px;
            }

            .event-button {
                padding: 10px 4px;
                font-size: 10.5px;
                letter-spacing: 0.2px;
            }
        }

        @media (max-width: 310px) {
            .event-card {
                flex-basis: 100%;
                width: 100%;
            }

            .event-button {
                font-size: 10px;
                padding: 9px 3px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="../index.html" class="brand" aria-label="MG Eventos - Inicio">
                <img src="../images/mg-eventos-logo.png" alt="MG Eventos">
                <span>MG Eventos</span>
            </a>

            <nav class="navigation">
                <span class="nav-link active" aria-current="page">EVENTOS</span>
                <a href="../servicios/index.html" class="nav-link">SERVICIOS</a>
                <a href="../contacto/index.html" class="nav-link">CONTACTO</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="events-section">
            <h1>PRÓXIMOS EVENTOS</h1>

            <p class="intro">
                Conoce los próximos encuentros y eventos que estamos preparando para ti.
            </p>

            <div class="events-grid">
                <article class="event-card">
                    <a
                        href="adviento/index.html"
                        class="event-image-link"
                        aria-label="Ver evento Adviento"
                    >
                        <img
                            src="../images/Flyer-Adviento.png"
                            alt="Adviento: tiempo de volver a empezar a través del perdón y la sanación"
                            class="event-image"
                        >
                    </a>

                    <div class="event-content">
                        <h2>ADVIENTO</h2>

                        <span class="event-date">
                            SÁBADO 28 DE NOVIEMBRE DE 2026
                        </span>

                        <p>
                            Tiempo de volver a empezar a través del perdón y la sanación.
                        </p>

                        <div class="event-actions">
                            <a
                                href="adviento/index.html"
                                class="event-button"
                            >
                                VER EVENTO
                            </a>

                            <a
                                href="https://api.whatsapp.com/send/?phone=573225276778&text=Quiero+m%C3%A1s+informaci%C3%B3n+del+evento+%2AADVIENTO%2A%3A+tiempo+de+volver+a+empezar+a+trav%C3%A9s+del+%2APERD%C3%93N+Y+LA+SANACI%C3%93N%2A&type=phone_number&app_absent=0"
                                class="event-button more-info-button"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                MÁS INFORMACIÓN
                            </a>
                        </div>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer>
        © 2026 MG Eventos
    </footer>
</body>
</html>
