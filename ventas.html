<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MG Eventos | Ventas</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f7fa; }
  iframe { display: block; width: 100%; height: 100vh; border: none; }
  .cargando { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; color: #6b7280; font-size: 14px; background: #f5f7fa; text-align: center; padding: 20px; }
</style>
</head>
<body>
  <div class="cargando" id="cargando">Cargando Ventas...</div>
  <iframe id="ventasFrame" style="display:none;" title="Boletería MG Eventos"></iframe>
  <script src="config.js"></script>
  <script>
    function obtenerParametro(nombre) {
      const parametros = new URLSearchParams(window.location.search);
      return parametros.get(nombre) || "";
    }

    const codigo = obtenerParametro("acceso");
    const frame = document.getElementById("ventasFrame");
    const cargando = document.getElementById("cargando");

    if (!codigo) {
      cargando.textContent = "Falta el código de acceso. Ingresa desde el panel de MG Eventos.";
    } else {
      frame.src = CONFIG.VENTAS_URL + "?acceso=" + encodeURIComponent(codigo);
      frame.onload = function() {
        cargando.style.display = "none";
        frame.style.display = "block";
      };
    }
  </script>
</body>
</html>
